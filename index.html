<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Msg | Fast Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Right Side Small Notification */
        #notification {
            position: fixed;
            top: 20px;
            right: -300px; /* শুরুতে স্ক্রিনের বাইরে থাকবে */
            background-color: #22c55e;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 9999;
            display: flex;
            items-center: center;
            gap: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        #notification.show {
            right: 20px; /* স্ক্রিনে চলে আসবে */
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen m-0">

    <!-- Small Notification -->
    <div id="notification">
        <span>✅</span> Message send successfully
    </div>

    <!-- Main Card -->
    <div class="glass p-8 rounded-2xl w-full max-w-sm shadow-2xl">
        <h2 class="text-white text-2xl font-bold mb-6 text-center tracking-tight">X-MESSAGE</h2>
        
        <div class="space-y-4">
            <input type="text" id="name" placeholder="Name" 
                class="w-full bg-gray-800 border border-gray-700 p-3 rounded-lg text-white outline-none focus:border-green-500 transition">
            
            <input type="number" id="number" placeholder="Phone Number" 
                class="w-full bg-gray-800 border border-gray-700 p-3 rounded-lg text-white outline-none focus:border-green-500 transition">

            <textarea id="message" placeholder="Your Message" rows="3"
                class="w-full bg-gray-800 border border-gray-700 p-3 rounded-lg text-white outline-none focus:border-green-500 transition resize-none"></textarea>

            <button onclick="send()" 
                class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition transform active:scale-95">
                Send Now
            </button>
        </div>
    </div>

    <script>
        function send() {
            const name = document.getElementById('name').value;
            const number = document.getElementById('number').value;
            const message = document.getElementById('message').value;
            const notif = document.getElementById('notification');

            if (name && number && message) {
                // নোটিফিকেশন দেখানো
                notif.classList.add('show');

                // ইনপুট বক্স রিসেট করা
                document.getElementById('name').value = '';
                document.getElementById('number').value = '';
                document.getElementById('message').value = '';

                // ৩ সেকেন্ড পর নোটিফিকেশন সরিয়ে ফেলা
                setTimeout(() => {
                    notif.classList.remove('show');
                }, 3000);
            } else {
                alert("Please fill all boxes!");
            }
        }
    </script>
</body>
</html>
